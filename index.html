              )}
            </div>
          </div>

          {/* BARRE DE NAVIGATION EN BAS STYLE APPLICATION VRAIE APK (BOTTOM NAV BAR) */}
          <div className="fixed bottom-0 left-0 right-0 z-40 bg-space-navy/95 backdrop-blur-xl border-t border-space-border/80 shadow-2xl pb-safe">
            <div className="max-w-xl mx-auto px-2 sm:px-4 py-2 flex items-center justify-around">
              {[
                { id: 'tracking', label: t.navHome || "Accueil", icon: '📡' },
                { id: 'passes', label: t.navInfo || "Info", icon: '⏱️' },
                { id: 'gallery', label: t.navPhotos || "Photos", icon: '🖼️' },
                { id: 'danny', label: t.navDanny || "Danny", icon: '👨‍🚀' },
                { id: 'ai', label: t.navAi || "IA Spatiale", icon: '🤖' },
                { id: 'settings', label: t.navSettings || "Réglages", icon: '⚙️' },
              ].map(item => {
                const isActive = activeTab === item.id;
                return (
                  <button
                    key={item.id}
                    type="button"
                    onClick={() => {
                      setActiveTab(item.id);
                      if (soundEnabled) playSpaceBeep('ping');
                    }}
                    className={`flex flex-col items-center justify-center py-1 px-2 sm:px-3 rounded-2xl transition-all relative select-none ${
                      isActive 
                        ? 'text-signal-orange scale-105 font-bold bg-signal-orange/10' 
                        : 'text-space-muted hover:text-slate-200 hover:bg-space-card/40'
                    }`}
                  >
                    {isActive && (
                      <span className="absolute -top-2 w-8 h-1 rounded-full bg-signal-orange glow-orange"></span>
                    )}
                    <span className="text-lg sm:text-xl leading-none mb-1">{item.icon}</span>
                    <span className="text-[11px] sm:text-xs font-sans tracking-tight whitespace-nowrap">
                      {item.label}
                    </span>
                  </button>
                );
              })}
            </div>
          </div>

          {/* MODAL LIGHTBOX / PLAYER VIDÉO */}
          {activeModalMedia && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-md flex items-center justify-center p-4">
              <div className="bg-space-navy border border-space-border max-w-3xl w-full rounded-3xl overflow-hidden shadow-2xl flex flex-col max-h-[90vh]">
                
                {/* Header Modal */}
                <div className="p-4 border-b border-space-border flex items-center justify-between">
                  <div className="flex items-center space-x-2">
                    <span className="text-xs font-mono uppercase bg-signal-blue/20 text-signal-blue px-2.5 py-1 rounded-lg">
                      {activeModalMedia.badge}
                    </span>
                    <h3 className="font-bold text-white text-sm sm:text-base truncate max-w-md">
                      {activeModalMedia.title}
                    </h3>
                  </div>
                  <button
                    onClick={() => setActiveModalMedia(null)}
                    className="text-space-muted hover:text-white p-1 rounded-lg text-lg"
                  >
                    ✕
                  </button>
                </div>

                {/* Corps Média */}
                <div className="flex-1 overflow-y-auto p-4 space-y-4">
                  {activeModalMedia.type === 'video' && activeModalMedia.youtubeId ? (
                    <div className="relative aspect-video w-full rounded-2xl overflow-hidden bg-black shadow-inner">
                      <iframe
                        src={`https://www.youtube-nocookie.com/embed/${activeModalMedia.youtubeId}?autoplay=1`}
                        title={activeModalMedia.title}
                        className="w-full h-full"
                        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                        allowFullScreen
                      ></iframe>
                    </div>
                  ) : (
                    <div className="rounded-2xl overflow-hidden bg-black">
                      <img
                        src={activeModalMedia.fullImage || activeModalMedia.thumbnail}
                        alt={activeModalMedia.title}
                        className="w-full max-h-[500px] object-contain mx-auto"
                      />
                    </div>
                  )}

                  <div className="space-y-2">
                    <div className="text-xs font-mono text-signal-orange">{activeModalMedia.date}</div>
                    <p className="text-sm text-slate-300 leading-relaxed">{activeModalMedia.desc}</p>
                  </div>
                </div>

                {/* Footer Modal */}
                <div className="p-4 border-t border-space-border flex justify-between items-center bg-space-deep/60">
                  {activeModalMedia.url && (
                    <a
                      href={activeModalMedia.url}
                      target="_blank"
                      rel="noopener noreferrer"
                      className="text-xs font-mono text-signal-blue hover:underline flex items-center space-x-1"
                    >
                      <span>Lien source NASA ↗</span>
                    </a>
                  )}
                  <button
                    onClick={() => setActiveModalMedia(null)}
                    className="px-5 py-2.5 bg-space-card hover:bg-space-border text-white text-xs font-semibold rounded-xl"
                  >
                    {t.close}
                  </button>
                </div>

              </div>
            </div>
          )}

          {/* MODAL PARAMÈTRES RAPIDE */}
          {showSettingsModal && (
            <div className="fixed inset-0 z-50 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-space-navy border border-space-border max-w-md w-full rounded-3xl p-6 shadow-2xl space-y-4">
                <div className="flex items-center justify-between pb-3 border-b border-space-border">
                  <h3 className="font-bold text-white text-lg flex items-center space-x-2">
                    <span>⚙️</span>
                    <span>{t.settings}</span>
                  </h3>
                  <button onClick={() => setShowSettingsModal(false)} className="text-space-muted hover:text-white">✕</button>
                </div>

                <div>
                  <label className="block text-xs font-mono uppercase text-space-muted mb-1.5">{t.changeLang}</label>
                  <div className="grid grid-cols-5 gap-1.5">
                    {['fr', 'en', 'es', 'zh', 'hi'].map(code => (
                      <button
                        key={code}
                        onClick={() => {
                          setLang(code);
                          localStorage.setItem('iss_lang', code);
                        }}
                        className={`p-2 rounded-xl text-xs font-bold ${lang === code ? 'bg-signal-blue text-white' : 'bg-space-card text-space-muted'}`}
                      >
                        {code.toUpperCase()}
                      </button>
                    ))}
                  </div>
                </div>

                <div>
                  <label className="block text-xs font-mono uppercase text-space-muted mb-1.5">{t.yourLocation}</label>
                  <select
                    value={userCity}
                    onChange={(e) => {
                      const selected = PRESET_CITIES.find(c => c.name === e.target.value);
                      if (selected) {
                        setUserCity(selected.name);
                        setUserCoords({ lat: selected.lat, lon: selected.lon });
                        localStorage.setItem('iss_city_name', selected.name);
                        localStorage.setItem('iss_user_coords', JSON.stringify({ lat: selected.lat, lon: selected.lon }));
                      }
                    }}
                    className="w-full bg-space-card border border-space-border text-white text-sm rounded-xl p-3"
                  >
                    {PRESET_CITIES.map(c => (
                      <option key={c.name} value={c.name}>{c.name}</option>
                    ))}
                  </select>
                </div>

                <button
                  type="button"
                  onClick={() => {
                    requestBrowserGeolocation();
                    setShowSettingsModal(false);
                  }}
                  className="w-full py-2.5 bg-space-card border border-space-border hover:border-signal-green text-signal-green text-xs font-semibold rounded-xl flex items-center justify-center space-x-1"
                >
                  <span>📍</span>
                  <span>{t.autoGeoloc}</span>
                </button>

                <div className="pt-2">
                  <button
                    onClick={() => setShowSettingsModal(false)}
                    className="w-full py-3 bg-signal-blue text-white font-bold text-sm rounded-2xl shadow-lg glow-blue"
                  >
                    {t.close}
                  </button>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    // Montage de l'application React
    const rootElement = document.getElementById('root');
    const root = ReactDOM.createRoot(rootElement);
    root.render(<App />);
  </script>
</body>
</html>
