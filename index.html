    // --- CONFIGURATION & CONSTANTES ---
    const NASA_API_KEY = "WHUeQIqacs8brGUEM4AkAVBKT0CWgjDzzybwFpYr";
    const GEMINI_API_KEY = "AIzaSyCSn7XJNEpvDjazijyXpYdhJTXtEB2qdpk";
    const ISS_API_URL = "https://api.wheretheiss.at/v1/satellites/25544";
    const REVERSE_GEO_URL = "https://api.bigdatacloud.net/data/reverse-geocode-client";
    const OPEN_METEO_API_URL = "https://api.open-meteo.com/v1/forecast";
    const MEDIA_REFRESH_INTERVAL = 3600000; // 1 heure
    const ISS_REFRESH_INTERVAL = 5000; // 5 secondes
    const WEATHER_REFRESH_INTERVAL = 900000; // 15 minutes

    // --- API MÉTÉO GRATUITE TEMPS RÉEL (Open-Meteo) & PRÉDICTION VISIBILITÉ ISS ---
    async function fetchLocationWeather(lat, lon) {
      try {
        const url = `${OPEN_METEO_API_URL}?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,weather_code,cloud_cover,visibility,wind_speed_10m&hourly=cloud_cover,relative_humidity_2m,visibility&timezone=auto`;
        const res = await fetch(url);
        if (!res.ok) throw new Error("Erreur Météo Open-Meteo");
        const data = await res.json();

        const current = data.current || {};
        const cloudCover = current.cloud_cover !== undefined ? current.cloud_cover : 20; // 0-100%
        const humidity = current.relative_humidity_2m !== undefined ? current.relative_humidity_2m : 55; // 0-100%
        const visibilityKm = current.visibility ? (current.visibility / 1000).toFixed(1) : "15.0";
        const temp = current.temperature_2m !== undefined ? Math.round(current.temperature_2m) : 18;
        const weatherCode = current.weather_code ?? 0;
        const windSpeed = current.wind_speed_10m !== undefined ? Math.round(current.wind_speed_10m) : 10;

        // Calcul de l'indice scientifique d'observation de l'ISS (0% à 100%)
        // Facteurs : Couverture nuageuse (60%), Humidité/Brume (25%), Précipitations (15%)
        let score = Math.max(0, 100 - (cloudCover * 0.7));
        if (humidity > 75) {
          score -= (humidity - 75) * 0.9;
        }
        if (weatherCode >= 50 && weatherCode <= 99) {
          score -= 45; // Pluie, bruine, neige, orage
        } else if (weatherCode >= 45 && weatherCode <= 48) {
          score -= 35; // Brouillard épais
        }
        score = Math.max(5, Math.min(100, Math.round(score)));

        let quality = 'ideal'; // 'ideal', 'good', 'fair', 'poor'
        if (score >= 80) quality = 'ideal';
        else if (score >= 60) quality = 'good';
        else if (score >= 35) quality = 'fair';
        else quality = 'poor';

        return {
          success: true,
          cloudCover,
          humidity,
          visibilityKm,
          temp,
          weatherCode,
          windSpeed,
          score,
          quality,
          hourly: data.hourly || null,
          updatedAt: new Date()
        };
      } catch (err) {
        console.warn("Météo Open-Meteo indisponible:", err);
        return null;
      }
    }

    // --- LECTEUR DE MUSIQUE SPATIALE UNIQUE (Fichier Audio Local dans le même dossier) ---
    // Lit par défaut le fichier 'music.mp3' placé à côté de index.html / ISS.html
    class LocalSingleAudioSystem {
      constructor() {
        this.htmlAudio = new Audio();
        this.htmlAudio.preload = "metadata";
        this.htmlAudio.loop = true;
        this.htmlAudio.volume = 0.70;

        this.isPlaying = false;
        this.volume = 0.70;
        this.isLooping = true;
        this.currentTime = 0;
        this.duration = 0;
        this.fileName = "music.mp3";
        this.fileSource = "./music.mp3";
        this.isCustomFile = false;
        this.loadError = null;
        this.listeners = new Set();

        // Initialiser la source
        this.htmlAudio.src = this.fileSource;

        // Événements audio natifs
        this.htmlAudio.addEventListener('play', () => {
          this.isPlaying = true;
          this.loadError = null;
          this.notify();
        });

        this.htmlAudio.addEventListener('pause', () => {
          this.isPlaying = false;
          this.notify();
        });

        this.htmlAudio.addEventListener('timeupdate', () => {
          this.currentTime = this.htmlAudio.currentTime || 0;
          this.duration = this.htmlAudio.duration || 0;
          this.notify();
        });

        this.htmlAudio.addEventListener('loadedmetadata', () => {
          this.duration = this.htmlAudio.duration || 0;
          this.loadError = null;
          this.notify();
        });

        this.htmlAudio.addEventListener('ended', () => {
          if (!this.isLooping) {
            this.isPlaying = false;
            this.currentTime = 0;
            this.notify();
          }
        });

        this.htmlAudio.addEventListener('error', (e) => {
          console.info("Fichier audio local 'music.mp3' non encore présent dans le dossier ou format non chargé.");
          this.isPlaying = false;
          this.loadError = "En attente du fichier music.mp3 dans le même dossier que index.html";
          this.notify();
        });
      }

      subscribe(fn) {
        this.listeners.add(fn);
        return () => this.listeners.delete(fn);
      }

      notify() {
        const payload = {
          isPlaying: this.isPlaying,
          volume: this.volume,
          isLooping: this.isLooping,
          currentTime: this.currentTime,
          duration: this.duration,
          fileName: this.fileName,
          fileSource: this.fileSource,
          isCustomFile: this.isCustomFile,
          loadError: this.loadError
        };
        this.listeners.forEach(fn => {
          try { fn(payload); } catch (e) {}
        });
      }

      play() {
        this.loadError = null;
        try {
          if (!this.htmlAudio.src || this.htmlAudio.src === '') {
            this.htmlAudio.src = this.fileSource;
          }
          this.htmlAudio.volume = this.volume;
          const promise = this.htmlAudio.play();
          if (promise !== undefined) {
            promise
              .then(() => {
                this.isPlaying = true;
                this.notify();
              })
              .catch((err) => {
                console.info("Lecture audio en attente de clic utilisateur ou fichier music.mp3 à ajouter :", err);
                this.isPlaying = false;
                this.loadError = "Placez 'music.mp3' à côté de index.html ou cliquez sur 'Choisir un fichier audio'";
                this.notify();
              });
          }
        } catch (e) {
          this.isPlaying = false;
          this.notify();
        }
      }

      pause() {
        this.isPlaying = false;
        try {
          this.htmlAudio.pause();
        } catch (e) {}
        this.notify();
      }

      togglePlay() {
        if (this.isPlaying) {
          this.pause();
        } else {
          this.play();
        }
      }

      seek(timeSeconds) {
        try {
          if (this.htmlAudio && isFinite(timeSeconds)) {
            this.htmlAudio.currentTime = timeSeconds;
            this.currentTime = timeSeconds;
            this.notify();
          }
        } catch (e) {}
      }

      setVolume(val) {
        this.volume = Math.max(0, Math.min(1, val));
        try {
          this.htmlAudio.volume = this.volume;
        } catch (e) {}
        this.notify();
      }

      toggleLoop() {
        this.isLooping = !this.isLooping;
        this.htmlAudio.loop = this.isLooping;
        this.notify();
      }

      // Charger un fichier audio choisi par l'utilisateur depuis son appareil
      loadCustomFile(file) {
        if (!file) return;
        try {
          const objectUrl = URL.createObjectURL(file);
          this.fileName = file.name;
          this.fileSource = objectUrl;
          this.isCustomFile = true;
          this.loadError = null;
          this.htmlAudio.src = objectUrl;
          this.htmlAudio.load();
          this.play();
        } catch (err) {
          console.warn("Erreur chargement fichier audio local:", err);
        }
      }

      // Réinitialiser au fichier par défaut 'music.mp3'
      resetToDefaultFile() {
        this.fileName = "music.mp3";
        this.fileSource = "./music.mp3";
        this.isCustomFile = false;
        this.loadError = null;
        this.htmlAudio.src = "./music.mp3";
        this.htmlAudio.load();
        this.play();
      }
    }

    // --- FORMULE DE HAVERSINE POUR CALCUL DE DISTANCE ---
    function calculateDistance(lat1, lon1, lat2, lon2) {
      if (lat1 === undefined || lon1 === undefined || lat2 === undefined || lon2 === undefined) return null;
      const R = 6371; // Rayon de la Terre en km
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = 
        Math.sin(dLat / 2) * Math.sin(dLat / 2) +
        Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * 
        Math.sin(dLon / 2) * Math.sin(dLon / 2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      return Math.round(R * c);
    }

        url: 'https://cdn.jsdelivr.net/gh/mrdoob/three.js@dev/examples/textures/planets/earth_atmos_2048.jpg',
        icon: '☀️',
        desc: 'Rendu classique jour avec océans vifs et continents détaillés'
      },
      dark: {
        id: 'dark',
        name: 'Espace Sombre',
        url: 'https://unpkg.com/three-globe/example/img/earth-dark.jpg',
        icon: '🌑',
        desc: 'Contraste cosmique sombre avec reliefs océaniques profonds'
      }
    };

    // --- COMPOSANT GLOBE 3D SPATIAL INTERACTIF (THREE.JS / WEBGL) ---
    function Space3DGlobe({
      issData,
      userCoords,
      userCity,
      issHistory,
      soundEnabled,
      playSpaceBeep,
      t,
      lang,
      isFullTab = false
    }) {
      const mountRef = useRef(null);
      const sceneRef = useRef(null);
      const rendererRef = useRef(null);
      const cameraRef = useRef(null);
      const earthMeshRef = useRef(null);
      const earthMatRef = useRef(null);
      const cloudsMeshRef = useRef(null);
      const issGroupRef = useRef(null);
      const userPinRef = useRef(null);
      const beamLineRef = useRef(null);
      const dirLightRef = useRef(null);

      // États interactifs
      const [currentTextureKey, setCurrentTextureKey] = useState('satellite');
      const [autoRotate, setAutoRotate] = useState(true);
      const [showClouds, setShowClouds] = useState(true);
      const [isSunlit, setIsSunlit] = useState(true);
      const [textureLoading, setTextureLoading] = useState(false);
      const [isTouchDragging, setIsTouchDragging] = useState(false);

      const textureCacheRef = useRef({});
      const isDraggingRef = useRef(false);
      const prevPointerPosRef = useRef({ x: 0, y: 0 });
      const rotationVelocityRef = useRef({ x: 0, y: 0 });
      const targetCamPosRef = useRef(null);

      // 1. Initialisation de la scène 3D
      useEffect(() => {
        if (!mountRef.current || typeof THREE === 'undefined') return;

        const container = mountRef.current;
        const width = container.clientWidth || 800;
        const height = container.clientHeight || (isFullTab ? 600 : 480);

        // Scène
        const scene = new THREE.Scene();
        sceneRef.current = scene;

        // Caméra Perspective
        const camera = new THREE.PerspectiveCamera(40, width / height, 0.1, 1000);
        camera.position.set(0, 3.2, 13.5);
        cameraRef.current = camera;

        // Renderer WebGL
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: "high-performance" });
        renderer.setSize(width, height);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
        if (THREE.sRGBEncoding) renderer.outputEncoding = THREE.sRGBEncoding;
        
        container.replaceChildren(renderer.domElement);
        rendererRef.current = renderer;

        // Éclairage Solaire & Ambiant
        const ambientLight = new THREE.AmbientLight(0x384968, 1.4);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 2.2);
        dirLight.position.set(12, 6, 9);
        scene.add(dirLight);
        dirLightRef.current = dirLight;

        const spaceFillLight = new THREE.DirectionalLight(0x1d4ed8, 0.7);
        spaceFillLight.position.set(-12, -5, -9);
        scene.add(spaceFillLight);

        // Champ d'étoiles cosmiques d'arrière-plan
        const starGeo = new THREE.BufferGeometry();
        const starCount = 1200;
        const starPos = new Float32Array(starCount * 3);
        for (let i = 0; i < starCount * 3; i += 3) {
          starPos[i] = (Math.random() - 0.5) * 120;
          starPos[i + 1] = (Math.random() - 0.5) * 120;
          starPos[i + 2] = (Math.random() - 0.5) * 120;
        }
        starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
        const starMat = new THREE.PointsMaterial({ color: 0x93c5fd, size: 0.25, transparent: true, opacity: 0.75 });
        const stars = new THREE.Points(starGeo, starMat);
        scene.add(stars);

        // Rayon terrestre
        const earthRadius = 4.6;
        const earthGeo = new THREE.SphereGeometry(earthRadius, 64, 64);

        // Texture procédurale instantanée (garantie 100% hors-ligne & fiable)
        const createEarthCanvasTexture = () => {
          const cvs = document.createElement('canvas');
          cvs.width = 1024;
          cvs.height = 512;
          const ctx = cvs.getContext('2d');

          // Océans dégradés profonds
          const oceanGrad = ctx.createLinearGradient(0, 0, 0, 512);
          oceanGrad.addColorStop(0, '#061a33');
          oceanGrad.addColorStop(0.5, '#0b3560');
          oceanGrad.addColorStop(1, '#05162a');
          ctx.fillStyle = oceanGrad;
          ctx.fillRect(0, 0, 1024, 512);

          // Méridiens et parallèles subtils
          ctx.strokeStyle = 'rgba(61, 107, 216, 0.25)';
          ctx.lineWidth = 1;
          for (let x = 0; x < 1024; x += 64) {
            ctx.beginPath();
            ctx.moveTo(x, 0);
            ctx.lineTo(x, 512);
            ctx.stroke();
          }
          for (let y = 0; y < 512; y += 32) {
            ctx.beginPath();
            ctx.moveTo(0, y);
            ctx.lineTo(1024, y);
            ctx.stroke();
          }

          // Équateur
          ctx.strokeStyle = 'rgba(255, 107, 53, 0.4)';
          ctx.lineWidth = 1.5;
          ctx.beginPath();
          ctx.moveTo(0, 256);
          ctx.lineTo(1024, 256);
          ctx.stroke();

          // Continents réalistes dessinés
          ctx.fillStyle = '#1e5e3a';
          // Eurasie & Afrique
          ctx.beginPath();
          ctx.ellipse(540, 190, 140, 95, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.beginPath();
          ctx.ellipse(530, 310, 85, 105, 0, 0, Math.PI * 2);
          ctx.fill();
          // Amériques
          ctx.beginPath();
          ctx.ellipse(250, 175, 95, 85, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.beginPath();
          ctx.ellipse(300, 345, 75, 100, 0, 0, Math.PI * 2);
          ctx.fill();
          // Océanie
          ctx.beginPath();
          ctx.ellipse(790, 340, 65, 50, 0, 0, Math.PI * 2);
          ctx.fill();

          return new THREE.CanvasTexture(cvs);
        };

        const defaultTexture = createEarthCanvasTexture();
        textureCacheRef.current['fallback'] = defaultTexture;

        const earthMat = new THREE.MeshPhongMaterial({
          map: defaultTexture,
          specular: new THREE.Color(0x38bdf8),
          shininess: 25,
          bumpScale: 0.05
        });
        earthMatRef.current = earthMat;

        // Texture Loader avec gestion du cache
        const textureLoader = new THREE.TextureLoader();
        const loadTexture = (texKey) => {
          const item = EARTH_TEXTURE_SETS[texKey];
          if (!item) return;

          if (textureCacheRef.current[texKey]) {
            earthMat.map = textureCacheRef.current[texKey];
            earthMat.needsUpdate = true;
            return;
          }

          setTextureLoading(true);
          textureLoader.load(
            item.url,
            (tex) => {
              tex.needsUpdate = true;
              textureCacheRef.current[texKey] = tex;
              earthMat.map = tex;
              earthMat.needsUpdate = true;
              setTextureLoading(false);
            },
            undefined,
            () => {
              setTextureLoading(false);
            }
          );
        };

        // Charger immédiatement la texture Satellite réelle NASA
        loadTexture('satellite');

        const earthMesh = new THREE.Mesh(earthGeo, earthMat);
        scene.add(earthMesh);
        earthMeshRef.current = earthMesh;

        // Halo d'atmosphère externe bleu cosmique
        const atmosGeo = new THREE.SphereGeometry(earthRadius * 1.035, 48, 48);
        const atmosMat = new THREE.MeshBasicMaterial({
          color: 0x38bdf8,
          transparent: true,
          opacity: 0.16,
          side: THREE.BackSide,
          blending: THREE.AdditiveBlending
        });
        const atmosMesh = new THREE.Mesh(atmosGeo, atmosMat);
        earthMesh.add(atmosMesh);

        // Nuages fins atmosphériques
        const cloudsGeo = new THREE.SphereGeometry(earthRadius * 1.012, 48, 48);
        const cloudsMat = new THREE.MeshPhongMaterial({
          color: 0xffffff,
          transparent: true,
          opacity: 0.14,
          blending: THREE.AdditiveBlending
        });
        const cloudsMesh = new THREE.Mesh(cloudsGeo, cloudsMat);
        earthMesh.add(cloudsMesh);
        cloudsMeshRef.current = cloudsMesh;

        // Trace de l'orbite 3D complète de l'ISS (inclinée à 51.64°)
        const orbitRadius = earthRadius * 1.085;
        const orbitCurve = new THREE.EllipseCurve(0, 0, orbitRadius, orbitRadius, 0, 2 * Math.PI, false, 0);
        const orbitPts = orbitCurve.getPoints(128);
        const orbitGeo = new THREE.BufferGeometry().setFromPoints(
          orbitPts.map(p => new THREE.Vector3(p.x, 0, p.y))
        );
        const orbitMat = new THREE.LineBasicMaterial({
          color: 0xff6b35,
          transparent: true,
          opacity: 0.5,
          linewidth: 1.5
        });
        const orbitLine = new THREE.Line(orbitGeo, orbitMat);
        orbitLine.rotation.x = (51.64 * Math.PI) / 180;
        earthMesh.add(orbitLine);

        // MODÈLE 3D DE LA STATION SPATIALE INTERNATIONALE (ISS)
        const issGroup = new THREE.Group();

        // Corps pressurisé principal
        const bodyGeo = new THREE.CylinderGeometry(0.1, 0.1, 0.75, 16);
        const bodyMat = new THREE.MeshStandardMaterial({ color: 0xf1f5f9, metalness: 0.85, roughness: 0.25 });
        const issBody = new THREE.Mesh(bodyGeo, bodyMat);
        issBody.rotation.z = Math.PI / 2;
        issGroup.add(issBody);

        // Poutre centrale
        const trussGeo = new THREE.BoxGeometry(1.6, 0.04, 0.04);
        const trussMat = new THREE.MeshStandardMaterial({ color: 0x94a3b8, metalness: 0.6, roughness: 0.4 });
        const issTruss = new THREE.Mesh(trussGeo, trussMat);
        issGroup.add(issTruss);

        // 8 Panneaux Solaires Photovoltaïques
        const panelGeo = new THREE.BoxGeometry(0.44, 0.012, 0.26);
        const panelMat = new THREE.MeshStandardMaterial({
          color: 0x0284c7,
          emissive: 0x0369a1,
          emissiveIntensity: 0.35,
          metalness: 0.95,
          roughness: 0.15
        });

        [-0.62, -0.28, 0.28, 0.62].forEach(x => {
          const p1 = new THREE.Mesh(panelGeo, panelMat);
          p1.position.set(x, 0, 0.22);
          issGroup.add(p1);

          const p2 = new THREE.Mesh(panelGeo, panelMat);
          p2.position.set(x, 0, -0.22);
          issGroup.add(p2);
        });

        // Balise clignotante de positionnement
        const beaconGeo = new THREE.SphereGeometry(0.08, 12, 12);
        const beaconMat = new THREE.MeshBasicMaterial({ color: 0xff6b35 });
        const issBeacon = new THREE.Mesh(beaconGeo, beaconMat);
        issBeacon.position.set(0, 0.16, 0);
        issGroup.add(issBeacon);

        // Cercle radio pulsant sous l'ISS
        const radarGeo = new THREE.RingGeometry(0.1, 0.7, 24);
        const radarMat = new THREE.MeshBasicMaterial({
          color: 0xff6b35,
          transparent: true,
          opacity: 0.35,
          side: THREE.DoubleSide
        });
        const radarRing = new THREE.Mesh(radarGeo, radarMat);
        radarRing.rotation.x = Math.PI / 2;
        issGroup.add(radarRing);

        earthMesh.add(issGroup);
        issGroupRef.current = issGroup;

        // BALISE PIN 3D UTILISATEUR
        const userGroup = new THREE.Group();
        const pinConeGeo = new THREE.ConeGeometry(0.12, 0.42, 16);
        const pinConeMat = new THREE.MeshStandardMaterial({ color: 0x3d6bd8, emissive: 0x1d4ed8, emissiveIntensity: 0.5 });
        const pinCone = new THREE.Mesh(pinConeGeo, pinConeMat);
        pinCone.rotation.x = Math.PI;
        pinCone.position.y = 0.21;
        userGroup.add(pinCone);

        const pinHeadGeo = new THREE.SphereGeometry(0.14, 16, 16);
        const pinHead = new THREE.Mesh(pinHeadGeo, pinConeMat);
        pinHead.position.y = 0.42;
        userGroup.add(pinHead);

        const userPulseGeo = new THREE.RingGeometry(0.08, 0.45, 20);
        const userPulseMat = new THREE.MeshBasicMaterial({ color: 0x38bdf8, transparent: true, opacity: 0.6, side: THREE.DoubleSide });
        const userPulse = new THREE.Mesh(userPulseGeo, userPulseMat);
        userPulse.rotation.x = Math.PI / 2;
        userGroup.add(userPulse);

        earthMesh.add(userGroup);
        userPinRef.current = userGroup;

        // Faisceau de liaison laser quand l'ISS est proche
        const beamGeo = new THREE.BufferGeometry().setFromPoints([
          new THREE.Vector3(0, 0, 0),
          new THREE.Vector3(0, 0, 0)
        ]);
        const beamMat = new THREE.LineBasicMaterial({
          color: 0x4dd48a,
          transparent: true,
          opacity: 0.8,
          linewidth: 2
        });
        const beamLine = new THREE.Line(beamGeo, beamMat);
        earthMesh.add(beamLine);
        beamLineRef.current = beamLine;

        // Boucle d'animation 60 FPS
        let animId;
        let clock = new THREE.Clock();

        const animate = () => {
          animId = requestAnimationFrame(animate);
          const time = clock.getElapsedTime();

          if (cloudsMeshRef.current) {
            cloudsMeshRef.current.rotation.y += 0.0006;
          }

          // Rotation automatique douce
          if (autoRotate && !isDraggingRef.current && earthMeshRef.current) {
            earthMeshRef.current.rotation.y += 0.0015;
          }

          // Inertie fluide lors du glissement manuel
          if (!isDraggingRef.current && (Math.abs(rotationVelocityRef.current.x) > 0.0001 || Math.abs(rotationVelocityRef.current.y) > 0.0001)) {
            if (earthMeshRef.current) {
              earthMeshRef.current.rotation.y += rotationVelocityRef.current.x;
              earthMeshRef.current.rotation.x += rotationVelocityRef.current.y;
              // Limiter l'angle vertical pour éviter les renversements
              earthMeshRef.current.rotation.x = Math.max(-Math.PI / 2.3, Math.min(Math.PI / 2.3, earthMeshRef.current.rotation.x));
            }
            rotationVelocityRef.current.x *= 0.94;
            rotationVelocityRef.current.y *= 0.94;
          }

          // Pulsation de la balise ISS et du radar
          if (issBeacon) {
            const sc = 1 + 0.3 * Math.sin(time * 5);
            issBeacon.scale.set(sc, sc, sc);
          }
          if (radarRing) {
            const rSc = 1 + 0.45 * Math.sin(time * 2.5);
            radarRing.scale.set(rSc, rSc, rSc);
            radarRing.material.opacity = 0.4 - 0.2 * Math.sin(time * 2.5);
          }

          // Pulsation balise utilisateur
          if (userPulse) {
            const uSc = 1 + 0.35 * Math.sin(time * 3);
            userPulse.scale.set(uSc, uSc, uSc);
            userPulse.material.opacity = 0.6 - 0.3 * Math.sin(time * 3);
          }

          // Interpolation fluide de caméra si recentrage ciblé
          if (targetCamPosRef.current && cameraRef.current) {
            cameraRef.current.position.lerp(targetCamPosRef.current, 0.08);
            cameraRef.current.lookAt(0, 0, 0);
            if (cameraRef.current.position.distanceTo(targetCamPosRef.current) < 0.08) {
              targetCamPosRef.current = null;
            }
          }

          renderer.render(scene, camera);
        };

        animate();

        // Gestion du redimensionnement de fenêtre
        const handleResize = () => {
          if (!container || !renderer || !camera) return;
          const w = container.clientWidth || 800;
          const h = container.clientHeight || 480;
          camera.aspect = w / h;
          camera.updateProjectionMatrix();
          renderer.setSize(w, h);
        };

        window.addEventListener('resize', handleResize);

        return () => {
          cancelAnimationFrame(animId);
          window.removeEventListener('resize', handleResize);
          renderer.dispose();
        };
      }, []);

      // 2. Synchronisation de la position 3D de l'ISS et de l'utilisateur
      useEffect(() => {
        if (!earthMeshRef.current || !issGroupRef.current) return;
        const earthRadius = 4.6;

        if (issData) {
          const issPos = latLonToVector3(issData.latitude, issData.longitude, earthRadius * 1.085);
          issGroupRef.current.position.copy(issPos);
          issGroupRef.current.lookAt(issPos.clone().multiplyScalar(2));

          // Vérifier si l'ISS est éclairée par le soleil
          const sunlit = issPos.z > -1.2;
          setIsSunlit(sunlit);
        }

        if (userCoords && userPinRef.current) {
          const userPos = latLonToVector3(userCoords.lat, userCoords.lon, earthRadius);
          userPinRef.current.position.copy(userPos);
          userPinRef.current.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), userPos.clone().normalize());

          // Faisceau de communication si l'ISS est à proximité (< 2800 km)
          if (issData && beamLineRef.current) {
            const issPos = issGroupRef.current.position;
            const dist3D = issPos.distanceTo(userPos);
            if (dist3D < 3.8) {
              beamLineRef.current.geometry.setFromPoints([userPos, issPos]);
              beamLineRef.current.visible = true;
            } else {
              beamLineRef.current.visible = false;
            }
          }
        }
      }, [issData, userCoords]);

      // 3. Gestion tactile et souris pour pivoter le globe à 360°
      const handlePointerDown = (e) => {
        isDraggingRef.current = true;
        setIsTouchDragging(true);
        const clientX = e.clientX || (e.touches && e.touches[0].clientX) || 0;
        const clientY = e.clientY || (e.touches && e.touches[0].clientY) || 0;
        prevPointerPosRef.current = { x: clientX, y: clientY };
        rotationVelocityRef.current = { x: 0, y: 0 };
      };

      const handlePointerMove = (e) => {
        if (!isDraggingRef.current || !earthMeshRef.current) return;
        const clientX = e.clientX || (e.touches && e.touches[0].clientX) || 0;
        const clientY = e.clientY || (e.touches && e.touches[0].clientY) || 0;
        
        const deltaX = (clientX - prevPointerPosRef.current.x) * 0.005;
        const deltaY = (clientY - prevPointerPosRef.current.y) * 0.005;

        earthMeshRef.current.rotation.y += deltaX;
        earthMeshRef.current.rotation.x += deltaY;
        earthMeshRef.current.rotation.x = Math.max(-Math.PI / 2.3, Math.min(Math.PI / 2.3, earthMeshRef.current.rotation.x));

        rotationVelocityRef.current = { x: deltaX, y: deltaY };
        prevPointerPosRef.current = { x: clientX, y: clientY };
      };

      const handlePointerUp = () => {
        isDraggingRef.current = false;
        setIsTouchDragging(false);
      };

      const handleWheel = (e) => {
        if (!cameraRef.current) return;
        const zoomDelta = e.deltaY * 0.01;
        const currentDist = cameraRef.current.position.length();
        const newDist = Math.max(7.5, Math.min(22.0, currentDist + zoomDelta));
        cameraRef.current.position.setLength(newDist);
      };

      // Changement de texture terrestre dynamique
      const handleSwitchTexture = (texKey) => {
        setCurrentTextureKey(texKey);
        if (soundEnabled) playSpaceBeep('blip');

        const item = EARTH_TEXTURE_SETS[texKey];
        if (!item || !earthMatRef.current) return;

        if (textureCacheRef.current[texKey]) {
          earthMatRef.current.map = textureCacheRef.current[texKey];
          earthMatRef.current.needsUpdate = true;
          return;
        }

        setTextureLoading(true);
        const loader = new THREE.TextureLoader();
        loader.load(
          item.url,
          (tex) => {
            tex.needsUpdate = true;
            textureCacheRef.current[texKey] = tex;
            if (earthMatRef.current) {
              earthMatRef.current.map = tex;
              earthMatRef.current.needsUpdate = true;
            }
            setTextureLoading(false);
          },
          undefined,
          () => {
            setTextureLoading(false);
          }
        );
      };

      // 4. Commandes de télécommande 3D avec vrais labels
      const handleCenterOnISS = () => {
        if (!issData || !earthMeshRef.current || !cameraRef.current) return;
        
        // Aligner la rotation de la Terre pour amener l'ISS face caméra
        const phi = (90 - issData.latitude) * (Math.PI / 180);
        const theta = (issData.longitude + 180) * (Math.PI / 180);
        
        earthMeshRef.current.rotation.x = -(phi - Math.PI / 2);
        earthMeshRef.current.rotation.y = -(theta - Math.PI / 2);
        
        targetCamPosRef.current = new THREE.Vector3(0, 0, 11);
        if (soundEnabled) playSpaceBeep('ping');
      };

      const handleCenterOnUser = () => {
        if (!userCoords || !earthMeshRef.current || !cameraRef.current) return;
        
        const phi = (90 - userCoords.lat) * (Math.PI / 180);
        const theta = (userCoords.lon + 180) * (Math.PI / 180);
        
        earthMeshRef.current.rotation.x = -(phi - Math.PI / 2);
        earthMeshRef.current.rotation.y = -(theta - Math.PI / 2);
        
        targetCamPosRef.current = new THREE.Vector3(0, 0, 11);
        if (soundEnabled) playSpaceBeep('ping');
      };

      const handleZoomIn = () => {
        if (!cameraRef.current) return;
        const currentDist = cameraRef.current.position.length();
        const newDist = Math.max(7.5, currentDist - 2.0);
        cameraRef.current.position.setLength(newDist);
        if (soundEnabled) playSpaceBeep('blip');
      };

      const handleZoomOut = () => {
        if (!cameraRef.current) return;
        const currentDist = cameraRef.current.position.length();
        const newDist = Math.min(22.0, currentDist + 2.0);
        cameraRef.current.position.setLength(newDist);
        if (soundEnabled) playSpaceBeep('blip');
      };

      return (
        <div className="flex flex-col space-y-3 w-full select-none">
          
          {/* BARRE SUPÉRIEURE DES CONTRÔLES 3D & TEXTURES NASA (AU-DESSUS DU GLOBE) */}
          <div className="bg-space-navy/95 border border-space-border/90 backdrop-blur-md p-3 sm:p-4 rounded-2xl shadow-xl space-y-3">
            
            {/* Ligne 1 : Sélecteur de Textures Terrestres Réelles de la NASA */}
            <div className="flex flex-wrap items-center justify-between gap-2">
              <div className="flex flex-wrap items-center gap-1.5">
                <span className="text-[11px] font-mono text-space-muted uppercase font-bold px-1 flex items-center gap-1">
                  <span>🌍</span> Textures NASA :
                </span>
                {Object.values(EARTH_TEXTURE_SETS).map(tex => {
                  const isSelected = currentTextureKey === tex.id;
                  return (
                    <button
                      key={tex.id}
                      type="button"
                      onClick={() => handleSwitchTexture(tex.id)}
                      className={`px-3 py-1.5 rounded-xl text-xs font-bold font-sans flex items-center space-x-1.5 transition-all active:scale-95 shadow-sm ${
                        isSelected
                          ? 'bg-signal-orange text-white border border-signal-orange glow-orange'
                          : 'bg-space-deep hover:bg-space-card border border-space-border text-space-muted hover:text-white'
                      }`}
                      title={tex.desc}
                    >
                      <span>{tex.icon}</span>
                      <span>{tex.name}</span>
                      {isSelected && (
                        <span className="w-1.5 h-1.5 rounded-full bg-white animate-ping ml-0.5"></span>
                      )}
                    </button>
                  );
                })}
              </div>

              {/* Indicateur de chargement de la texture */}
              {textureLoading && (
                <div className="bg-signal-blue/20 border border-signal-blue/50 text-signal-blue px-3 py-1 rounded-xl text-xs font-mono flex items-center space-x-2 animate-pulse">
                  <span className="w-2 h-2 rounded-full bg-signal-blue animate-ping"></span>
                  <span>Chargement HD…</span>
                </div>
              )}
            </div>

            {/* Ligne 2 : Télécommande 3D & Commandes de Caméra */}
            <div className="flex flex-wrap items-center justify-between gap-2 pt-2 border-t border-space-border/60">
              <div className="flex flex-wrap items-center gap-1.5">
                <span className="text-[11px] font-mono text-space-muted uppercase font-bold px-1 flex items-center gap-1">
                  <span>🎮</span> Contrôles :
                </span>

                <button
                  type="button"
                  onClick={handleCenterOnISS}

        poor: { bg: 'bg-signal-red/20', text: 'text-signal-red', border: 'border-signal-red/40', badge: 'bg-signal-red text-white', title: t.weatherScorePoor || 'Ciel Bouché / Nuages ☁️' },

                  <p className="text-xs text-space-muted font-mono">

                <button

              {/* Visibilité */}
              <div className="bg-space-deep/80 border border-space-border rounded-2xl p-3 space-y-1.5 shadow-inner">
                <div className="text-[11px] font-mono text-space-muted flex items-center justify-between">
                  <span>{t.weatherVisibility || "Visibilité"}</span>
                  <span>🔭</span>

                <div className="text-base sm:text-lg font-bold text-signal-blue font-mono">
                  {weatherData.visibilityKm} km

                <div className="text-[11px] font-mono text-space-muted flex items-center justify-between">
                  <span>{t.weatherTemp || "Température"}</span>
                  <span>🌡️</span>
                </div>
                <div className="text-base sm:text-lg font-bold text-signal-orange font-mono">

            </div>

            {/* Diagnostic & Conseil d'Observation Stargazing */}
            <div className={`p-3.5 rounded-2xl border text-xs sm:text-sm flex items-start space-x-3 ${scoreColors.bg} ${scoreColors.border}`}>
              <span className="text-lg">🔭</span>
              <div className="space-y-0.5">
                <div className="font-bold text-white">
                  {score >= 75 
                    ? (t.weatherIdealAdvice || "Ciel limpide et dégagé ! Observation à l'œil nu exceptionnelle.")
                    : score >= 50
                    ? (t.weatherGoodAdvice || "Quelques nuages épars, l'ISS sera visible entre les trouées.")
                    : score >= 35
                    ? (t.weatherFairAdvice || "Ciel voilé ou brumeux, l'ISS sera plus difficile à discerner.")
                    : (t.weatherPoorAdvice || "Trop de nuages ou pluie : visibilité compromise.")}

                <p className="text-slate-300 text-xs leading-relaxed">

                    ? `Ciel dégagé à ${100 - weatherData.cloudCover}%. Lors du survol au-dessus de ${userCity.split(',')[0]}, cherchez un point blanc très éclatant filant d'ouest en est sans clignoter.`
                    : score >= 50
                    ? `Couverture nuageuse modérée (${weatherData.cloudCover}%). Gardez l'œil ouvert lors des fenêtres de ciel clair indiquées dans l'onglet Info.`
                    : `Couverture nuageuse à ${weatherData.cloudCover}%. L'observation au sol risque d'être bloquée par les nuages bas.`}
                </p>
              </div>
            </div>

          </div>
        </div>
      );

    // --- COMPOSANT LECTEUR DE MUSIQUE LOCALE UNIQUE (Space Music Deck) ---
    function SpaceMusicDeck({ audioState, t, compact = false }) {
      const fileInputRef = useRef(null);
      const isPlaying = audioState.isPlaying;
      const volume = audioState.volume;
      const isLooping = audioState.isLooping;
      const currentTime = audioState.currentTime || 0;
      const duration = audioState.duration || 0;
      const fileName = audioState.fileName || "music.mp3";
      const isCustomFile = audioState.isCustomFile;
      const loadError = audioState.loadError;

      const formatTime = (sec) => {
        if (!sec || isNaN(sec) || !isFinite(sec)) return "00:00";
        const m = Math.floor(sec / 60);
        const s = Math.floor(sec % 60);
        return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
      };

      const handleSeek = (e) => {
        const targetTime = parseFloat(e.target.value);
        spaceAudio.seek(targetTime);
      };

      const handleFileChange = (e) => {
        const file = e.target.files && e.target.files[0];
        if (file) {
          spaceAudio.loadCustomFile(file);
        }
      };

      return (
        <div className="bg-gradient-to-br from-space-navy via-[#0c1433] to-space-deep border border-space-border/90 rounded-3xl p-4 sm:p-6 shadow-2xl relative overflow-hidden group">
          {/* Lueur Cosmique d'arrière-plan */}
          <div className="absolute -top-12 -right-12 w-48 h-48 bg-signal-orange/10 rounded-full blur-3xl pointer-events-none"></div>
          <div className="absolute -bottom-12 -left-12 w-48 h-48 bg-signal-blue/10 rounded-full blur-3xl pointer-events-none"></div>

          {/* Input file caché pour charger n'importe quel fichier audio local */}
          <input
            type="file"
            ref={fileInputRef}
            onChange={handleFileChange}
            accept="audio/*,.mp3,.ogg,.wav,.m4a,.flac"
            className="hidden"
          />

          <div className="relative z-10 space-y-4">
            {/* Barre Supérieure : Titre & Statut */}
            <div className="flex items-center justify-between">
              <div className="flex items-center space-x-3">
                <div className="w-10 h-10 rounded-2xl bg-gradient-to-tr from-signal-blue/30 to-signal-orange/30 border border-signal-orange/30 flex items-center justify-center text-xl shadow-inner glow-orange">
                  🎵
                </div>
                <div>
                  <div className="flex items-center space-x-2">
                    <h3 className="font-bold text-white text-sm sm:text-base font-sans tracking-tight">
                      {t.spaceMusic || "Musique Spatiale"}
                    </h3>
                    <span className={`px-2.5 py-0.5 rounded-full text-[10px] font-mono font-bold uppercase tracking-wider ${
                      isPlaying 
                        ? 'bg-signal-green/20 text-signal-green border border-signal-green/40 animate-pulse' 
                        : 'bg-space-card text-space-muted border border-space-border'
                    }`}>
                      {isPlaying ? (t.spaceMusicPlaying || "En Lecture") : (t.spaceMusicPaused || "En Pause")}
                    </span>
                  </div>
                  <p className="text-xs text-space-muted font-mono truncate">
                    Fichier : <strong className="text-signal-orange">{fileName}</strong> ({isCustomFile ? "Morceau chargé" : "Dans le même dossier"})
                  </p>
                </div>
              </div>

              {/* Égaliseur visuel animé */}
              <div className="flex items-end space-x-1 h-6 px-3 py-1 bg-space-deep/90 rounded-xl border border-space-border shadow-inner">
                {[45, 80, 50, 95, 65, 85, 40].map((height, i) => (
                  <span
                    key={i}
                    className={`w-1 rounded-full transition-all duration-300 ${
                      isPlaying 
                        ? 'bg-gradient-to-t from-signal-blue to-signal-orange' 
                        : 'bg-space-border'
                    }`}
                    style={{
                      height: isPlaying ? `${Math.max(25, (height + (i % 3) * 15))}%` : '20%',
                      animation: isPlaying ? `bounce 0.8s infinite ease-in-out ${i * 0.12}s` : 'none'
                    }}
                  />
                ))}
              </div>
            </div>

            {/* Piste en cours & Boutons Principaux */}
            <div className="bg-space-deep/90 border border-space-border/80 rounded-2xl p-4 flex flex-col sm:flex-row sm:items-center justify-between gap-3 shadow-inner">
              <div className="space-y-1">
                <div className="flex items-center space-x-2">
                  <span className="text-sm sm:text-base font-bold text-white font-sans">{fileName}</span>
                  <span className="text-[10px] font-mono px-2 py-0.5 rounded bg-signal-blue/20 text-signal-blue border border-signal-blue/30 uppercase">
                    {isCustomFile ? "Audio Local" : "music.mp3"}
                  </span>
                </div>
                <div className="text-xs text-slate-300 font-sans">
                  {isCustomFile 
                    ? "Morceau audio personnalisé en cours de lecture" 
                    : "Placé directement à côté de index.html dans le répertoire"}
                </div>
              </div>

              {/* Bouton de Lecture / Pause Unique et Grand */}
              <div className="flex items-center space-x-2 self-end sm:self-center">
                {isPlaying ? (
                  <button
                    type="button"
                    onClick={() => spaceAudio.pause()}
                    className="px-5 py-2.5 rounded-2xl font-bold font-sans text-xs sm:text-sm flex items-center space-x-2 bg-gradient-to-r from-amber-500 to-signal-orange text-white glow-orange border border-amber-400 transition-all active:scale-95 shadow-lg"
                    title="Mettre la musique en pause"
                  >
                    <span className="text-base">⏸️</span>
                    <span>{t.pauseBtn || "Mettre en Pause"}</span>
                  </button>
                ) : (
                  <button
                    type="button"
                    onClick={() => spaceAudio.play()}
                    className="px-5 py-2.5 rounded-2xl font-bold font-sans text-xs sm:text-sm flex items-center space-x-2 bg-gradient-to-r from-signal-blue to-blue-600 text-white glow-blue border border-blue-400 transition-all active:scale-95 shadow-lg"
                    title="Démarrer la musique"
                  >
                    <span className="text-base">▶️</span>
                    <span>{t.playBtn || "Lancer la Musique"}</span>
                  </button>
                )}

                {/* Bouton Boucle */}
                <button
                  type="button"
                  onClick={() => spaceAudio.toggleLoop()}
                  className={`p-2.5 rounded-2xl border text-xs font-bold transition-all active:scale-95 shadow-sm flex items-center space-x-1 ${
                    isLooping 
                      ? 'bg-signal-orange/20 border-signal-orange/60 text-signal-orange' 
                      : 'bg-space-card border-space-border text-space-muted hover:text-white'
                  }`}
                  title={isLooping ? "Lecture en boucle activée" : "Lecture en boucle désactivée"}
                >
                  <span>🔁</span>
                  <span className="hidden sm:inline">{isLooping ? "Boucle" : "1x"}</span>
                </button>
              </div>
            </div>

            {/* Barre de progression temporelle */}
            <div className="space-y-1.5 pt-1">
              <div className="flex items-center justify-between text-xs font-mono text-space-muted">
                <span>{formatTime(currentTime)}</span>
                <span>{duration > 0 ? formatTime(duration) : "--:--"}</span>
              </div>
              <input
                type="range"
                min="0"
                max={duration > 0 ? duration : 100}
                step="0.1"
                value={duration > 0 ? currentTime : 0}
                onChange={handleSeek}
                className="w-full h-2 bg-space-deep rounded-lg appearance-none cursor-pointer accent-signal-orange"
              />
            </div>

            {/* Contrôles du bas : Volume et Choix de fichier */}
            <div className="flex flex-col sm:flex-row items-center justify-between gap-3 pt-2 border-t border-space-border/60 text-xs font-mono text-space-muted">
              {/* Volume */}
              <div className="flex items-center space-x-2 w-full sm:w-auto">
                <button
                  type="button"
                  onClick={() => spaceAudio.setVolume(volume === 0 ? 0.70 : 0)}
                  className="hover:text-white text-base"
                >
                  {volume === 0 ? '🔇' : volume < 0.5 ? '🔉' : '🔊'}
                </button>
                <input
                  type="range"
                  min="0"
                  max="1"
                  step="0.05"
                  value={volume}
                  onChange={(e) => spaceAudio.setVolume(parseFloat(e.target.value))}
                  className="w-28 sm:w-36 h-1.5 bg-space-deep rounded-lg appearance-none cursor-pointer accent-signal-orange"
                />
                <span className="w-8 text-right font-bold text-white">{Math.round(volume * 100)}%</span>
              </div>

              {/* Bouton pour charger un fichier local ou réinitialiser */}
              <div className="flex items-center space-x-2 self-end sm:self-center">
                {isCustomFile && (
                  <button
                    type="button"
                    onClick={() => spaceAudio.resetToDefaultFile()}
                    className="px-3 py-1.5 rounded-xl bg-space-card hover:bg-space-border text-white text-[11px] font-sans transition-all"
                  >
                    🔄 Remettre music.mp3
                  </button>
                )}
                <button
                  type="button"
                  onClick={() => fileInputRef.current && fileInputRef.current.click()}
                  className="px-3 py-1.5 rounded-xl bg-space-card hover:bg-space-border border border-space-border/80 text-signal-orange text-[11px] font-sans font-medium flex items-center space-x-1.5 transition-all shadow-sm active:scale-95"
                >
                  <span>📂</span>
                  <span>Choisir un fichier audio (.mp3)</span>
                </button>
              </div>
            </div>

            {/* Note d'information explicative */}
            <div className="p-3 bg-space-card/60 border border-space-border/60 rounded-2xl text-[11px] text-space-muted font-sans flex items-start space-x-2">
              <span className="text-signal-blue text-sm">💡</span>
              <p>
                <strong>Conseil :</strong> Placez simplement votre fichier audio nommé <code className="text-signal-orange font-mono font-bold bg-space-deep px-1.5 py-0.5 rounded">music.mp3</code> dans le même dossier que <code className="text-white font-mono">index.html</code>. Vous pouvez aussi cliquer sur <em>"Choisir un fichier audio"</em> pour jouer directement un morceau depuis votre appareil.
              </p>
            </div>
          </div>
        </div>
      );
    }

    // --- COMPOSANT PRINCIPAL APP ---
    function App() {
      // 1. États Utilisateur & Préférences
      const [lang, setLang] = useState(() => localStorage.getItem('iss_lang') || 'fr');
      const [userCity, setUserCity] = useState(() => localStorage.getItem('iss_city_name') || 'Paris, France');
      const [userCoords, setUserCoords] = useState(() => {
        const saved = localStorage.getItem('iss_user_coords');
        return saved ? JSON.parse(saved) : { lat: 48.8566, lon: 2.3522 };
      });
      const [hasSetup, setHasSetup] = useState(() => localStorage.getItem('iss_has_setup') === 'true');
      const [soundEnabled, setSoundEnabled] = useState(() => localStorage.getItem('iss_sound') === 'true');
      
      // 2. Audio Spatiale Temps Réel (Fichier local unique music.mp3)
      const [audioState, setAudioState] = useState({
        isPlaying: false,
        volume: 0.70,
        isLooping: true,
        currentTime: 0,
        duration: 0,
        fileName: "music.mp3",
        fileSource: "./music.mp3",
        isCustomFile: false,
        loadError: null
      });
      const [showMusicCapsule, setShowMusicCapsule] = useState(true);

      // 3. Télémétrie ISS & Réseau
      const [issData, setIssData] = useState(null);
      const [issHistory, setIssHistory] = useState([]);
      const [issLocationName, setIssLocationName] = useState("Océan / Zone internationale");
      const [userDistance, setUserDistance] = useState(null);
      const [isApproaching, setIsApproaching] = useState(null);
      const [issLoading, setIssLoading] = useState(true);
      const [issApiFailed, setIssApiFailed] = useState(false);
      const [isOnline, setIsOnline] = useState(navigator.onLine);

      // 3.5 Météo Locale & Prédiction de Visibilité ISS (Open-Meteo API Gratuite)
      const [weatherData, setWeatherData] = useState(null);
      const [weatherLoading, setWeatherLoading] = useState(false);

      // 4. Galerie Médias
      const [medias, setMedias] = useState(FALLBACK_MEDIAS);
      const [mediaLoading, setMediaLoading] = useState(false);
      const [mediaErrorMsg, setMediaErrorMsg] = useState(null);
      const [lastMediaUpdate, setLastMediaUpdate] = useState(new Date());
      const [activeModalMedia, setActiveModalMedia] = useState(null);

      // 5. Chat IA Spatiale Locale (100% Hors-ligne & Rapide)
      const [chatMessages, setChatMessages] = useState([
        {
          role: "assistant",
          text: "🧑‍🚀 Bonjour ! Je suis l'Officier Scientifique IA de l'ISS. Choisissez l'une des questions ci-dessous ou tapez votre question pour explorer instantanément la station !"
        }
      ]);
      const [chatInput, setChatInput] = useState("");
      const [chatLoading, setChatLoading] = useState(false);
      const [activeAiCategory, setActiveAiCategory] = useState("all");
      const [copiedMessageIndex, setCopiedMessageIndex] = useState(null);
      const [speakingMessageIndex, setSpeakingMessageIndex] = useState(null);
      const chatEndRef = useRef(null);

      // 6. Navigation & UI APK
      const [activeTab, setActiveTab] = useState('tracking'); // 'tracking', 'passes', 'gallery', 'danny', 'ai', 'settings'
      const [mapViewMode, setMapViewMode] = useState('3d'); // '3d' pour Globe 3D Three.js, '2d' pour Carte 2D Plane
      const [showSettingsModal, setShowSettingsModal] = useState(false);
      const [isSpeaking, setIsSpeaking] = useState(false);

      const t = I18N[lang] || I18N.fr;

      // Abonnement aux changements d'état du moteur de musique spatiale
      useEffect(() => {
        const unsubscribe = spaceAudio.subscribe((state) => {
          setAudioState({ ...state });
        });
        return unsubscribe;
      }, []);

      // --- ÉCOUTEURS RÉSEAU EN TEMPS RÉEL ---
      useEffect(() => {
        const handleOnline = () => {
          setIsOnline(true);
          setIssApiFailed(false);
          setMediaErrorMsg(null);
        };
        const handleOffline = () => {
          setIsOnline(false);
          setIssApiFailed(true);
        };
        window.addEventListener('online', handleOnline);
        window.addEventListener('offline', handleOffline);
        return () => {
          window.removeEventListener('online', handleOnline);
          window.removeEventListener('offline', handleOffline);
        };
      }, []);

      // --- SAUVEGARDE PRÉFÉRENCES ---
      const handleSaveSetup = (selectedLang, cityObj) => {
        setLang(selectedLang);
        setUserCity(cityObj.name);
        setUserCoords({ lat: cityObj.lat, lon: cityObj.lon });
        setHasSetup(true);
        localStorage.setItem('iss_lang', selectedLang);
        localStorage.setItem('iss_city_name', cityObj.name);
        localStorage.setItem('iss_user_coords', JSON.stringify({ lat: cityObj.lat, lon: cityObj.lon }));
        localStorage.setItem('iss_has_setup', 'true');
      };

      const toggleSound = () => {
        const next = !soundEnabled;
        setSoundEnabled(next);
        localStorage.setItem('iss_sound', next.toString());
        if (next) playSpaceBeep('ping');
      };

      // --- GÉOLOCALISATION GPS NAVIGATEUR ---
      const requestBrowserGeolocation = () => {
        if (!navigator.geolocation) {
          alert("La géolocalisation n'est pas supportée par votre navigateur.");
          return;
        }
        navigator.geolocation.getCurrentPosition(
          async (pos) => {
            const coords = { lat: pos.coords.latitude, lon: pos.coords.longitude };
            try {
              const res = await fetch(`${REVERSE_GEO_URL}?latitude=${coords.lat}&longitude=${coords.lon}&localityLanguage=${lang}`);
              const data = await res.json();
              const name = (data.city || data.locality || data.principalSubdivision || "Position GPS") + (data.countryName ? `, ${data.countryName}` : "");
              handleSaveSetup(lang, { name, lat: coords.lat, lon: coords.lon });
            } catch (e) {
              handleSaveSetup(lang, { name: "Position GPS", lat: coords.lat, lon: coords.lon });
            }
          },
          (err) => {
            alert("Impossible de récupérer votre position : " + err.message);
          }
        );
      };

      // --- REVERSE GEOCODING ISS ---
      const fetchIssLocationName = async (lat, lon) => {
        try {
          const res = await fetch(`${REVERSE_GEO_URL}?latitude=${lat}&longitude=${lon}&localityLanguage=${lang}`);
          if (!res.ok) throw new Error("Geo fail");
          const data = await res.json();
          const place = [data.locality, data.principalSubdivision, data.countryName].filter(Boolean).join(", ");
          if (place) {
            setIssLocationName(place);
          } else {
            if (lat > 50) setIssLocationName("Océan Arctique / Haute latitude Nord");
            else if (lat < -50) setIssLocationName("Océan Austral / Antarctique");
            else if (lon > -40 && lon < 0 && lat > 0) setIssLocationName("Océan Atlantique Nord");
            else if (lon > -40 && lon < 0 && lat <= 0) setIssLocationName("Océan Atlantique Sud");
            else if (lon > 60 && lon < 100 && lat < 20) setIssLocationName("Océan Indien");
            else if (lon < -100 || lon > 120) setIssLocationName("Océan Pacifique");
            else setIssLocationName("Espace Maritime International");
          }
        } catch (e) {
          setIssLocationName("Zone maritime / Hors frontière terrestre");
        }
      };

      // --- SUIVI TEMPS RÉEL ISS (5 SECONDES) ---
      const fetchISS = async () => {
        try {
          const res = await fetch(ISS_API_URL);
          if (!res.ok) throw new Error("ISS Fetch Error");
          const data = await res.json();
          
          setIssData(data);
          setIssLoading(false);
          setIssApiFailed(false);

          if (soundEnabled) {
            playSpaceBeep('ping');
          }

          // Mémoriser la trajectoire pour la trace orbitale (25 points)
          setIssHistory((prev) => {
            const next = [...prev, { lat: data.latitude, lon: data.longitude, time: Date.now() }];
            return next.slice(-25);
          });

          // Calcul de la distance utilisateur
          if (userCoords) {
            const dist = calculateDistance(userCoords.lat, userCoords.lon, data.latitude, data.longitude);
            setUserDistance((currentDist) => {
              if (currentDist !== null) {
                setIsApproaching(dist < currentDist);
              }
              return dist;
            });

            if (dist < 2500 && soundEnabled) {
              playSpaceBeep('alert');
            }
          }

          fetchIssLocationName(data.latitude, data.longitude);

        } catch (err) {
          console.warn("Erreur API ISS :", err);
          setIssApiFailed(true);
          setIssLoading(false);
        }
      };

      useEffect(() => {
        fetchISS();
        const interval = setInterval(fetchISS, ISS_REFRESH_INTERVAL);
        return () => clearInterval(interval);
      }, [userCoords, lang, soundEnabled]);

      // --- MÉTÉO LOCALE & SCORE D'OBSERVATION ISS (OPEN-METEO API GRATUITE) ---
      const fetchWeather = async () => {
        if (!userCoords) return;
        setWeatherLoading(true);
        try {
          const w = await fetchLocationWeather(userCoords.lat, userCoords.lon);
          if (w) {
            setWeatherData(w);
          }
        } catch (e) {
          console.warn("Météo observation error:", e);
        } finally {
          setWeatherLoading(false);
        }
      };

      useEffect(() => {
        fetchWeather();
        const weatherInterval = setInterval(fetchWeather, WEATHER_REFRESH_INTERVAL);
        return () => clearInterval(weatherInterval);
      }, [userCoords?.lat, userCoords?.lon]);

      // --- GALERIE MÉDIAS NASA / APOD AVEC AUTO-REFRESH 1H ---
      const fetchSpatialMedias = async () => {
        setMediaLoading(true);
        setMediaErrorMsg(null);
        try {
          const apodUrl = `https://api.nasa.gov/planetary/apod?api_key=${NASA_API_KEY}&count=6`;
          let res = await fetch(apodUrl).catch(() => null);
          
          let apodData = null;
          if (res && res.ok) {
            apodData = await res.json();
          } else {
            // Tenter avec DEMO_KEY
            const fallbackRes = await fetch(`https://api.nasa.gov/planetary/apod?api_key=DEMO_KEY&count=6`).catch(() => null);
            if (fallbackRes && fallbackRes.ok) {
              apodData = await fallbackRes.json();
            }
          }

          if (!apodData || !Array.isArray(apodData)) {
            throw new Error("Connexion réseau indisponible");
          }

          const formattedApod = apodData.map((item, idx) => ({
            id: `apod-${idx}-${item.date}`,
            type: item.media_type === 'video' ? 'video' : 'photo',
            badge: item.media_type === 'video' ? 'VIDÉO NASA' : 'APOD NASA',
            title: item.title || "Cliché Spatial NASA",
            date: item.date || "Récemment",
            thumbnail: item.thumbnail_url || item.url || FALLBACK_MEDIAS[1].thumbnail,
            fullImage: item.hdurl || item.url,
            youtubeId: item.media_type === 'video' && item.url?.includes('youtube') ? item.url.split('embed/')[1]?.split('?')[0] : null,
            url: item.url,
            desc: item.explanation ? (item.explanation.slice(0, 160) + '…') : "Photographie spatiale officielle issue des archives de la NASA."
          }));

          const merged = [...FALLBACK_MEDIAS.slice(0, 3), ...formattedApod, ...FALLBACK_MEDIAS.slice(3)];
          setMedias(merged);
          setLastMediaUpdate(new Date());
        } catch (err) {
          console.warn("Échec récupération APOD :", err);
          setMediaErrorMsg(t.mediaError);
          // Garde la liste de réserve
          setMedias(FALLBACK_MEDIAS);
        } finally {
          setMediaLoading(false);
        }
      };

      useEffect(() => {
        fetchSpatialMedias();
        const mediaTimer = setInterval(fetchSpatialMedias, MEDIA_REFRESH_INTERVAL);
        return () => clearInterval(mediaTimer);
      }, []);

      // --- ASSISTANT IA SPATIALE LOCALE (OFFLINE & INSTANTANÉE) ---
      const handleSendChatMessage = (presetTextOrId) => {
        const textToSend = presetTextOrId || chatInput;
        if (!textToSend || !textToSend.trim() || chatLoading) return;

        // Déterminer le libellé affiché pour l'utilisateur
        let userDisplayQuestion = textToSend;
        const matchedById = LOCAL_SPACE_AI_KB.find(k => k.id === textToSend);
        if (matchedById) {
          userDisplayQuestion = matchedById.question[lang] || matchedById.question.fr;
        }

        const userMsg = { role: "user", text: userDisplayQuestion };
        setChatMessages(prev => [...prev, userMsg]);
        if (!presetTextOrId) setChatInput("");
        setChatLoading(true);

        if (soundEnabled) playSpaceBeep('ping');

        // Réponse ultra-rapide et réaliste avec télémétrie orbitale
        setTimeout(() => {
          const aiResult = getLocalAIResponse(textToSend, lang);
          setChatMessages(prev => [
            ...prev,
            { 
              role: "assistant", 
              text: aiResult.text,
              topic: aiResult.matchedItem ? aiResult.matchedItem.category : null 
            }
          ]);
          setChatLoading(false);
          if (soundEnabled) playSpaceBeep('blip');

          setTimeout(() => {
            chatEndRef.current?.scrollIntoView({ behavior: 'smooth' });
          }, 60);
        }, 220);
      };

      // --- LECTURE AUDIO D'UN MESSAGE DU CHAT ---
      const handleSpeakChatMessage = (text, index) => {
        if (!('speechSynthesis' in window)) {
          alert("Synthèse vocale non supportée sur ce navigateur.");
          return;
        }
        if (speakingMessageIndex === index) {
          window.speechSynthesis.cancel();
          setSpeakingMessageIndex(null);
          return;
        }
        window.speechSynthesis.cancel();

        // Nettoyer les emojis et caractères Markdown pour une prononciation fluide
        const cleanText = text.replace(/[\*\_\[\]\#\(\)\~]/g, '').replace(/[\u{1F300}-\u{1F9FF}]/gu, '');
        const utterance = new SpeechSynthesisUtterance(cleanText);
        utterance.lang = lang === 'fr' ? 'fr-FR' : lang === 'es' ? 'es-ES' : lang === 'zh' ? 'zh-CN' : lang === 'hi' ? 'hi-IN' : 'en-US';
        utterance.rate = 0.98;
        utterance.pitch = 1.0;
        utterance.onend = () => setSpeakingMessageIndex(null);
        utterance.onerror = () => setSpeakingMessageIndex(null);
        
        setSpeakingMessageIndex(index);
        window.speechSynthesis.speak(utterance);
      };

      // --- COPIER UN MESSAGE DANS LE PRESSE-PAPIER ---
      const handleCopyChatMessage = (text, index) => {
        navigator.clipboard.writeText(text).then(() => {
          setCopiedMessageIndex(index);
          setTimeout(() => setCopiedMessageIndex(null), 2000);
        }).catch(() => {});
      };

      // --- LECTURE AUDIO DU MESSAGE DE DANNY ---
      const handleSpeakDanny = () => {
        if (!('speechSynthesis' in window)) {
          alert("Synthèse vocale non disponible sur ce navigateur.");
          return;
        }
        if (isSpeaking) {
          window.speechSynthesis.cancel();
          setIsSpeaking(false);
          return;
        }

        const utterance = new SpeechSynthesisUtterance(t.dannyMsg);
        utterance.lang = lang === 'fr' ? 'fr-FR' : lang === 'es' ? 'es-ES' : lang === 'zh' ? 'zh-CN' : lang === 'hi' ? 'hi-IN' : 'en-US';
        utterance.rate = 0.95;
        utterance.pitch = 1.0;
        utterance.onend = () => setIsSpeaking(false);
        utterance.onerror = () => setIsSpeaking(false);
        
        setIsSpeaking(true);
        window.speechSynthesis.speak(utterance);
      };

      // --- CALCUL SIMULÉ DE PASSAGES ISS PRÉCIS ---
      const calculatedPasses = useMemo(() => {
        if (!userCoords) return [];
        const now = Date.now();
        return [
          {
            id: 1,
            time: new Date(now + 42 * 60 * 1000),
            durationSec: 360,
            maxElevation: "74°",
            azimuth: "SO ➔ NE",
            brightness: "-3.4 (Très brillant)"
          },
          {
            id: 2,
            time: new Date(now + (42 + 92) * 60 * 1000),
            durationSec: 280,
            maxElevation: "48°",
            azimuth: "O ➔ E",
            brightness: "-2.1 (Brillant)"
          },
          {
            id: 3,
            time: new Date(now + (42 + 92 * 2 + 15) * 60 * 1000),
            durationSec: 390,
            maxElevation: "86° (Au zénith)",
            azimuth: "OSO ➔ ENE",
            brightness: "-3.8 (Exceptionnel)"
          }
        ];
      }, [userCoords]);

      // --- RENDU : ÉCRAN D'ACCUEIL / SETUP SI PREMIÈRE VISITE ---
      if (!hasSetup) {
        return (
          <div className="min-h-screen bg-space-deep text-slate-100 flex items-center justify-center p-4 radar-grid">
            <div className="max-w-xl w-full bg-space-navy border border-space-border rounded-3xl p-6 md:p-8 shadow-2xl relative overflow-hidden">
              <div className="absolute -top-24 -right-24 w-48 h-48 bg-signal-blue/20 rounded-full blur-3xl"></div>
              <div className="absolute -bottom-24 -left-24 w-48 h-48 bg-signal-orange/20 rounded-full blur-3xl"></div>

              {/* Logo & Titre */}
              <div className="flex items-center space-x-3 mb-6">
                <div className="w-12 h-12 rounded-2xl bg-gradient-to-tr from-signal-blue to-signal-orange flex items-center justify-center text-2xl shadow-lg glow-orange">
                  🛰️
                </div>
                <div>
                  <h1 className="text-2xl font-bold tracking-tight text-white">{t.appTitle}</h1>
                  <p className="text-xs text-signal-orange font-mono uppercase tracking-wider">{t.appSubtitle}</p>
                </div>
              </div>

              <div className="space-y-6">
                <div className="p-4 bg-space-card/80 border border-space-border rounded-2xl">
                  <h2 className="text-lg font-semibold text-white mb-1">{t.welcomeTitle}</h2>
                  <p className="text-sm text-space-muted">{t.welcomeDesc}</p>
                </div>

                {/* Choix de la langue */}
                <div>
                  <label className="block text-xs font-mono uppercase text-space-muted mb-2">
                    {t.selectLanguage}
                  </label>
                  <div className="grid grid-cols-5 gap-2">
                    {[
                      { code: 'fr', label: 'Français', flag: '🇫🇷' },
                      { code: 'en', label: 'English', flag: '🇬🇧' },
                      { code: 'es', label: 'Español', flag: '🇪🇸' },
                      { code: 'zh', label: '中文', flag: '🇨🇳' },
                      { code: 'hi', label: 'हिन्दी', flag: '🇮🇳' },
                    ].map(item => (
                      <button
                        key={item.code}
                        type="button"
                        onClick={() => setLang(item.code)}
                        className={`p-2.5 rounded-xl border text-center transition-all ${
                          lang === item.code 
                            ? 'bg-signal-blue border-signal-blue text-white font-bold shadow-md glow-blue' 
                            : 'bg-space-card border-space-border text-space-muted hover:border-slate-500'
                        }`}
                      >
                        <div className="text-xl">{item.flag}</div>
                        <div className="text-[11px] truncate mt-1">{item.label}</div>
                      </button>
                    ))}
                  </div>
                </div>

                {/* Choix de la ville */}
                <div>
                  <label className="block text-xs font-mono uppercase text-space-muted mb-2">
                    {t.yourLocation}
                  </label>
                  <select
                    value={userCity}
                    onChange={(e) => {
                      const selected = PRESET_CITIES.find(c => c.name === e.target.value);
                      if (selected) {
                        setUserCity(selected.name);
                        setUserCoords({ lat: selected.lat, lon: selected.lon });
                      }
                    }}
                    className="w-full bg-space-card border border-space-border text-white text-sm rounded-xl p-3.5 focus:outline-none focus:border-signal-blue"
                  >
                    {PRESET_CITIES.map(c => (
                      <option key={c.name} value={c.name}>{c.name}</option>
                    ))}
                  </select>
                </div>

                {/* Bouton GPS */}
                <button
                  type="button"
                  onClick={requestBrowserGeolocation}
                  className="w-full py-3 px-4 rounded-xl bg-space-card border border-space-border hover:border-signal-green text-signal-green text-sm font-semibold flex items-center justify-center space-x-2 transition-all active:scale-98"
                >
                  <span>📍</span>
                  <span>{t.autoGeoloc}</span>
                </button>

                {/* Bouton Valider avec Lancement Musique Spatiale */}
                <button
                  type="button"
                  onClick={() => {
                    const currentCity = PRESET_CITIES.find(c => c.name === userCity) || PRESET_CITIES[0];
                    handleSaveSetup(lang, { name: userCity, lat: userCoords.lat, lon: userCoords.lon });
                    // Démarrage immédiat de la musique spatiale dès l'entrée
                    try {
                      spaceAudio.play();
                    } catch (e) {}
                  }}
                  className="w-full py-4 px-6 rounded-2xl bg-gradient-to-r from-signal-orange to-red-500 hover:from-orange-600 hover:to-red-600 text-white font-bold text-base shadow-xl glow-orange flex items-center justify-center space-x-2 transition-all transform active:scale-95"
                >
                  <span>🚀</span>
                  <span>{t.saveAndStart}</span>
                  <span className="text-xs bg-white/20 px-2 py-0.5 rounded-full font-mono font-normal">🎶 Audio ON</span>
                </button>
              </div>
            </div>
          </div>
        );
      }

      // --- RENDU PRINCIPAL DU DASHBOARD STYLE APK ---
      return (
        <div className="min-h-screen bg-space-deep text-slate-100 flex flex-col pb-24">
          
          {/* BANNIÈRE HORS-LIGNE / CONNEXION INTERROMPUE */}
          {(!isOnline || issApiFailed) && (
            <div className="bg-gradient-to-r from-red-600 via-rose-700 to-red-600 text-white py-2.5 px-4 text-center text-xs sm:text-sm font-semibold flex flex-wrap items-center justify-center gap-2 shadow-lg sticky top-0 z-50 animate-pulse">
              <span className="text-base">📡</span>
              <span>{t.apiErrorConnection}</span>
              <button
                onClick={fetchISS}
                className="ml-2 px-2.5 py-1 bg-white/20 hover:bg-white/30 rounded-lg text-xs font-bold underline cursor-pointer"
              >
                {t.retryConnection}
              </button>
            </div>
          )}

          {/* ALERTE PROXIMITÉ ISS (< 2500 KM) */}
          {userDistance !== null && userDistance < 2500 && (
            <div className="bg-gradient-to-r from-signal-orange via-red-600 to-signal-orange text-white py-2.5 px-4 text-center text-xs sm:text-sm font-bold flex items-center justify-center space-x-2 shadow-lg sticky top-0 z-40">
              <span className="text-lg animate-bounce">🚨</span>
              <span>{t.issNearbyAlert} ({userDistance} km)</span>
              <span className="text-lg">🛰️</span>
            </div>
          )}

          {/* EN-TÊTE SUPÉRIEUR STYLE APPLICATION MOBILE */}
          <header className="bg-space-navy/95 border-b border-space-border/80 sticky top-0 z-30 backdrop-blur-md pt-safe">
            <div className="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
              
              {/* Logo & Titre */}
              <div className="flex items-center space-x-3 cursor-pointer" onClick={() => setActiveTab('tracking')}>
                <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-signal-blue to-signal-orange flex items-center justify-center text-xl shadow-md glow-orange">
                  🛰️
                </div>
